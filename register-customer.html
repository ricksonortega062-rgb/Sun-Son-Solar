<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create a Customer Account — Sun Son Solar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-nav">
    <div class="wrap site-nav__inner">
        <a href="register-customer.html" class="brand">
            <span class="brand__mark" aria-hidden="true"></span>
            Sun Son Solar
        </a>
    </div>
</header>

<main>
    <section class="auth-section">
        <div class="wrap auth-wrap">
            <div class="auth-card auth-card--wide">
                <h1>Create a Customer Account</h1>
                <p class="auth-card__sub">Sign up to request quotes, track your installation, and view your system.</p>

                <div id="formMessage" class="alert alert--error" hidden></div>
                <form id="customerForm" class="form form--grid" novalidate>
                    <label>First Name
                        <input type="text" name="first_name" required>
                    </label>
                    <label>Last Name
                        <input type="text" name="last_name" required>
                    </label>
                    <label>Middle Name
                        <input type="text" name="middle_name">
                    </label>
                    <label>Birthdate
                        <input type="date" name="birthdate" required>
                    </label>
                    <label>Gender
                        <select name="gender" required>
                            <option value="">Select…</option>
                            <option value="Female">Female</option>
                            <option value="Male">Male</option>
                            <option value="Other">Other</option>
                        </select>
                    </label>
                    <label>Email
                        <input type="email" name="email" required>
                    </label>
                    <label>Phone Number
                        <input type="tel" name="phone" required>
                    </label>
                    <label class="span-2">Address
                        <input type="text" name="address" required>
                    </label>
                    <label>Username
                        <input type="text" name="username" required minlength="5">
                    </label>
                    <label></label>
                    <label>Password
                        <input type="password" name="password" required minlength="8">
                    </label>
                    <label>Confirm Password
                        <input type="password" name="confirm_password" required minlength="8">
                    </label>

                    <button type="submit" class="btn btn--solid btn--full span-2">Create Account</button>
                </form>

                <p class="auth-card__foot">Employee ka? <a href="register-employee.html">Employee sign up dito</a></p>
            </div>
        </div>
    </section>
</main>

<script src="assets/js/main.js"></script>
<script src="assets/js/validate.js"></script>
</body>
</html>
